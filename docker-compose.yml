version: "3.8"

services:
  frontend:
    build:
      context: ./Skillify-Frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BACKEND_URL=http://backend:5000
    volumes:
      - ./Skillify-Frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - skillify-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ./Skillify-Backend/Flask
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - PYTHONUNBUFFERED=1
    volumes:
      - ./Skillify-Backend/Flask:/app
    networks:
      - skillify-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  skillify-network:
    driver: bridge
